<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteParty</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <button id="themeBtn" class="theme-btn" title="Change background theme">🎨</button>
    <div class="container">
        <header>
            <h1><img src="/favicon.svg" alt="" style="width: 1em; height: 1em; vertical-align: middle; margin-right: 0.2em;">PasteParty</h1>
            <p class="subtitle">Let's paste some fun! Text & images welcome! 🎉</p>
        </header>

        <div id="app">
            <div id="create-view" class="view">
                <div class="paste-area" id="pasteArea">
                    <div class="paste-placeholder">
                        <p>🖼️ Ctrl + V here 📝</p>
                        <p class="hint">🖱️ Or double-click to input text</p>
                    </div>
                    <textarea id="textInput" placeholder="Type or paste your content here..."></textarea>
                    <div id="imagePreview" class="hidden"></div>
                </div>
                <div class="controls">
                    <button id="saveBtn" class="btn btn-primary" disabled>💾 Save to Party</button>
                    <button id="clearBtn" class="btn btn-secondary">🧹 Clear</button>
                </div>
                
                <div id="pastes-list-container">
                    <div class="pastes-header">
                        <h2>Saved Pastes</h2>
                        <button id="deleteAllBtn" class="btn btn-danger btn-small" disabled>🗑️ Clear Party</button>
                    </div>
                    <div id="pastes-list"></div>
                </div>
            </div>

            <div id="view-view" class="view hidden">
                <div class="paste-header">
                    <button id="newBtn" class="btn btn-secondary">🎉 New Paste</button>
                    <button id="deleteBtn" class="btn btn-danger">🗑️ Delete</button>
                </div>
                <div id="pasteContent"></div>
            </div>
        </div>

        <div id="notification" class="notification hidden"></div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
